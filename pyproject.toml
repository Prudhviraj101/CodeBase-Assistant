[project]
name = "codebase-agent"
version = "0.1.0"
description = "An agentic AI system that answers natural language questions about any codebase using AST-aware chunking, hybrid retrieval, and a multi-step ReAct reasoning loop."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-google-genai>=2.0.8",
    "langchain-openai>=0.3.5",
    "langchain-ollama>=0.2.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=0.4",
    "chromadb>=1.0",
    "tree-sitter>=0.24",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "gitpython>=3.1",
    "rank-bm25>=0.2",
    "streamlit>=1.45",
    "python-dotenv>=1.0",
    "ollama>=0.3.0",
]

[project.scripts]
codebase-agent = "src.ui.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
